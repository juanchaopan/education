name: Spike 28 Mandarin file transcription
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transcription:
    if: github.ref == 'refs/heads/spike/28-browser-voice-touch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install synthetic audio tools
        run: sudo apt-get install -y espeak-ng ffmpeg
      - name: Transcribe synthetic phrases in two formats
        env:
          SPIKE_OPENAI_API_KEY: ${{ secrets.SPIKE_OPENAI_API_KEY }}
        run: node spikes/browser-voice-touch/transcribe.mjs

