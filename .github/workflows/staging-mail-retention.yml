name: staging-mail-retention
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-mail-retention
  cancel-in-progress: false
jobs:
  cleanup:
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:libs && npm run build -w @education/api
      - run: node scripts/cleanup-staging-mail.mjs
        env:
          STAGING_DATABASE: 'true'
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.STAGING_DATABASE_CA_CERT }}
          DELETION_LEDGER_URL: ${{ secrets.STAGING_DELETION_LEDGER_URL }}
          DELETION_LEDGER_CA_CERT: ${{ secrets.STAGING_DELETION_LEDGER_CA_CERT }}
