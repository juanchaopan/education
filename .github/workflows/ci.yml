name: ci
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: education
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: education_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U education -d education_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://education:ci-only-password@127.0.0.1:5432/education_test
      # The deletion ledger is a separate database, as it is in deployments.
      DELETION_LEDGER_URL: postgres://education:ci-only-password@127.0.0.1:5432/education_ledger_test
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:staging
      - run: psql "$DATABASE_URL" -c 'CREATE DATABASE education_ledger_test'
      - run: npm run db:migrate
      - run: npm run test:db
      - run: npm run db:complete-deletions -w @education/api
      # WebKit runs the lesson sound checks, as Safari plays lessons on iPads.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  # Screenshots against the reviewed baselines, and the accessibility checks,
  # in the same pinned Playwright image as a local `npm run test:visual`.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diff
          path: test-results/visual/
  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install jscpd .
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:accounts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: isolated-account-test-results
          path: test-results/accounts/
  ci:
    if: always()
    needs: [app, visual, duplication, accounts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          APP: ${{ needs.app.result }}
          VISUAL: ${{ needs.visual.result }}
          DUPLICATION: ${{ needs.duplication.result }}
          ACCOUNTS: ${{ needs.accounts.result }}
        run: >-
          test "$APP" = success && test "$VISUAL" = success && test "$DUPLICATION" = success &&
          test "$ACCOUNTS" = success
  # Main's CI, started by a push or a dispatch, hands its run to staging once
  # every check passed. The run that completes is often one the auto-merge
  # bot's token started, and its completion starts no workflow_run; a dispatch
  # is the one event that token can start. Staging reads the `ci` job of this
  # run, which has passed by then, so this job stays outside the gate, and it
  # releases the commit only while it is still the head of main.
  release-staging:
    needs: ci
    if: vars.STAGING_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the staging release of this run
        run: gh workflow run staging.yml --repo "$GITHUB_REPOSITORY" --ref main -f ci_run="$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
