name: staging
# The auto-merge bot pushes merges with GITHUB_TOKEN, which starts no
# workflow, and a run it dispatches starts no workflow_run when it completes.
# Dispatches are the exception, so each step of the release hands over by one:
# a completed pull request check starts main's CI, and main's CI dispatches
# this workflow with its run once every check passed. No run waits for CI.
on:
  # Checks of main release through their own dispatch, and merge queue checks
  # belong to no pull request head.
  workflow_run:
    workflows: [ci, ai-review, commits]
    types: [completed]
    branches-ignore: [main, 'gh-readonly-queue/**']
  workflow_dispatch:
    inputs:
      ci_run:
        description: 留空则发布当前 main（它的 CI 没有通过时先派发 CI）；main 的 CI 通过后自动填入它的运行编号
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  configuration:
    if: vars.STAGING_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Staging is not enabled. Configure the dedicated project and credentials described in docs/deployment/staging.md; no deployment was attempted.' >> "$GITHUB_STEP_SUMMARY"
  # Not queued: GitHub keeps only the newest waiting run of a group, and a
  # dropped pull request check could be the one that sees its merge. Checks
  # completing together may each start CI; main's CI keeps only the newest.
  prepare:
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    if: >-
      vars.STAGING_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Select the exact passing main commit
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const { selectMainRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/staging-trigger.mjs`);
            const result = await selectMainRelease({
              api: github.rest, ...context.repo, eventName: context.eventName, payload: context.payload,
              wait: ms => new Promise(resolve => setTimeout(resolve, ms)),
            });
            core.setOutput('sha', result.sha ?? '');
            core.setOutput('ready', String(result.ready));
            const outcome = result.ready ? `releasing ${result.sha}` : 'this run releases nothing';
            await core.summary.addRaw(`Staging gate: ${result.reason}; ${outcome}.\n`).write();
  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    # One release at a time. GitHub keeps only the newest waiting release, so
    # an older commit never replaces a newer one; runs that release nothing
    # never queue here.
    concurrency:
      group: education-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build candidate, migrate, smoke, then promote staging
        run: node scripts/deploy-staging.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          STAGING_DATABASE: 'true'
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://education-access-spike.hyp.app' }}
          STAGING_VERCEL_PROJECT_ID: ${{ vars.STAGING_VERCEL_PROJECT_ID || 'prj_UYpAbi3rHNsoEdnOYGWiOo8L2WP0' }}
          STAGING_VERCEL_TEAM_ID: ${{ vars.STAGING_VERCEL_TEAM_ID || 'team_6WBQUpNIhHEGrjeEWxoFyN62' }}
          VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.STAGING_DATABASE_CA_CERT }}
          DELETION_LEDGER_URL: ${{ secrets.STAGING_DELETION_LEDGER_URL }}
          DELETION_LEDGER_CA_CERT: ${{ secrets.STAGING_DELETION_LEDGER_CA_CERT }}
          AUTH_RATE_LIMIT_KEY: ${{ secrets.STAGING_AUTH_RATE_LIMIT_KEY }}
          PIN_PEPPER: ${{ secrets.STAGING_PIN_PEPPER }}
          MAIL_ENABLED: ${{ vars.STAGING_MAIL_ENABLED || 'false' }}
          MAIL_PROVIDER_APPROVED: ${{ vars.STAGING_MAIL_PROVIDER_APPROVED || 'false' }}
          GMAIL_USER: ${{ vars.STAGING_GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.STAGING_GMAIL_APP_PASSWORD }}
          MAIL_PAYLOAD_KEY: ${{ secrets.STAGING_MAIL_PAYLOAD_KEY }}
          OPENAI_API_KEY: ${{ secrets.STAGING_OPENAI_API_KEY }}
          OPENAI_TUTORING_ELIGIBLE: ${{ vars.STAGING_OPENAI_TUTORING_ELIGIBLE || 'false' }}
          OPENAI_TRANSCRIPTION_ELIGIBLE: ${{ vars.STAGING_OPENAI_TRANSCRIPTION_ELIGIBLE || 'false' }}
          AI_MONTHLY_BUDGET_USD: ${{ vars.STAGING_AI_MONTHLY_BUDGET_USD }}
  # A release that main's CI dispatched completes without starting
  # staging-alerts, so a run reports its own jobs: every run with a release
  # and every run whose prepare job failed. A run that only handled a pull
  # request check leaves the alerts to the next release. Reports run one at a
  # time per kind, so two runs never open the same alert twice, and a waiting
  # release report is replaced only by a newer release report.
  alerts:
    needs: [prepare, deploy]
    if: >-
      ${{ !cancelled() && vars.STAGING_ENABLED == 'true' &&
      (needs.prepare.result == 'failure' || needs.deploy.result != 'skipped') }}
    concurrency:
      group: staging-report-${{ needs.deploy.result == 'skipped' && 'prepare' || 'release' }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/staging-alert-report.yml
    with:
      workflow: ${{ github.workflow }}
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      run-id: ${{ github.run_id }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
