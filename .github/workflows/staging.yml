name: staging
on:
  workflow_run:
    workflows: [ci, ai-review, commits]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: education-staging
  cancel-in-progress: false
jobs:
  configuration:
    if: vars.STAGING_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Staging is not enabled. Configure the dedicated project and credentials described in docs/deployment/staging.md; no deployment was attempted.' >> "$GITHUB_STEP_SUMMARY"
  prepare:
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    if: >-
      vars.STAGING_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Select the exact passing main commit
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const { prepareMainRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/staging-trigger.mjs`);
            const result = await prepareMainRelease({
              api: github.rest, ...context.repo, eventName: context.eventName, payload: context.payload,
              wait: ms => new Promise(resolve => setTimeout(resolve, ms)),
            });
            core.setOutput('sha', result.sha ?? '');
            core.setOutput('ready', String(result.ready));
            await core.summary.addRaw(`Staging gate: ${result.reason}; no release until exact-main CI passes.\n`).write();
  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build candidate, migrate, smoke, then promote staging
        run: node scripts/deploy-staging.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          STAGING_DATABASE: 'true'
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF || 'telkaiyxprpetmqthyhn' }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://education-access-spike.hyp.app' }}
          STAGING_VERCEL_PROJECT_ID: ${{ vars.STAGING_VERCEL_PROJECT_ID || 'prj_UYpAbi3rHNsoEdnOYGWiOo8L2WP0' }}
          STAGING_VERCEL_TEAM_ID: ${{ vars.STAGING_VERCEL_TEAM_ID || 'team_6WBQUpNIhHEGrjeEWxoFyN62' }}
          VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.STAGING_DATABASE_CA_CERT }}
          AUTH_RATE_LIMIT_KEY: ${{ secrets.STAGING_AUTH_RATE_LIMIT_KEY }}
          MAIL_ENABLED: ${{ vars.STAGING_MAIL_ENABLED || 'false' }}
          MAIL_PROVIDER_APPROVED: ${{ vars.STAGING_MAIL_PROVIDER_APPROVED || 'false' }}
          GMAIL_USER: ${{ secrets.STAGING_GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.STAGING_GMAIL_APP_PASSWORD }}
          MAIL_PAYLOAD_KEY: ${{ secrets.STAGING_MAIL_PAYLOAD_KEY }}
