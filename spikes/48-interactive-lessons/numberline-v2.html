<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小探索家 · 双轨追及</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091727;color:#ecf6ff;font:16px "Microsoft YaHei","PingFang SC",sans-serif}
main{max-width:1060px;margin:auto;padding:24px}
header{border-radius:28px 28px 0 0;padding:28px 34px 20px;background:radial-gradient(ellipse at 80% 20%,#255472,transparent 55%),#132b40}
small{color:#a4dce9;letter-spacing:.16em;font-weight:700}h1{font-size:clamp(33px,6vw,58px);line-height:1.12;margin:9px 0}p{line-height:1.6}
header p{margin-bottom:0}section{padding:16px 24px;background:#152c44}
svg{display:block;width:100%;background:repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 32px),#102239;border:1px solid #789db65e;border-radius:20px}
.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-top:13px}
input{width:100%;accent-color:#b2ec91;margin:12px 0;cursor:ew-resize}
button{background:#244661;color:white;border:1px solid #6d9cbb;border-radius:12px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #f8bd63;outline-offset:3px}button:disabled{opacity:.5;cursor:default}
.primary{background:#c4ed9e;color:#203b2f;border-color:#c4ed9e}
output{min-width:5.5ch;color:#ffe2a0;font-size:21px;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;color:#d9e9f8;font-size:15px;padding:0 0 10px}
.legend span:first-child{color:#ffe2a0}.legend span:nth-child(2){color:#a6eaff}

footer{background:#203d55;border-radius:0 0 28px 28px;padding:14px 24px 22px}
footer p{margin:6px 0}.muted{color:#b5cedf;font-size:14px}

#audio{float:right}.ruler{cursor:pointer;outline-offset:3px}.ruler:focus-visible{outline:2px solid #f5cb86}
.ruler-box{fill:#22485a;stroke:#bce5a1}.ruler text{pointer-events:none}
#formula{margin:12px 0;padding:12px;border:1px solid #7499ac;border-radius:13px;background:#112a40}

.line-expression{border:2px dashed #92c5c0;border-radius:12px;color:#cae6ed}
.line-tile{color:#203b32;background:#c5eea9;border:0;min-width:39px;cursor:grab;touch-action:none;padding:7px}

<main>
<header><small>六年级 · 数轴动点 · 教学探针 #48</small><button id="audio" aria-label="听完整题目">🔊 听题</button><h1>追上以后，距离还会是 4 吗？</h1><p id="intro"></p></header>
<section aria-label="数轴追及实验">
  <div class="legend"><span>● M 是线段 AB 的中点</span><span>● N 是线段 CD 的中点</span><span>两条线段都向右移动</span></div>
  <svg id="track" viewBox="0 0 760 222" role="group" aria-label="两条线段沿数轴同时移动"></svg>
  <div class="controls"><label for="time">拖动时间轴</label><output id="clock" for="time"></output><span class="muted">找到距离 4 时，直接点图上的距离尺。</span></div>
  <input id="time" aria-label="拖动时间轴" type="range" min="0" max="16" step="0.25" value="0">
  <p class="feedback" id="feedback" role="status"></p>
</section>
<footer>
  <p id="marks"></p>
  <p class="muted" id="variation" hidden>条件变了。线段 AB 的速度变成每秒 3 个单位，CD 的速度没变。先猜相遇时间，再找出中点距离为 4 的两个时刻。</p>
  <div id="formula" hidden></div><div class="controls"><button id="switch" hidden>试一道变化题</button></div>
</footer>
</main>
<script>
const $ = id => document.getElementById(id);
let speed = 2;
let time = 0;
let ruler = true;

let stamps = new Set();
const x = coordinate => 36 + (coordinate + 4) * 13.7;
const fmt = value => String(Number(value.toFixed(2)));
const gap = () => Math.abs(10 - (speed - 1) * time);
function segment(left, length, y, color, labels) {
  const right = left + length;
  const middle = (left + right) / 2;
  return '<path d="M '+x(left)+' '+y+' H '+x(right)+'" stroke="'+color+'" stroke-width="9" stroke-linecap="round"/>' +
    [left,middle,right].map((point,index) => '<circle cx="'+x(point)+'" cy="'+y+'" r="'+(index===1?9:4)+'" fill="'+color+'"/><text x="'+x(point)+'" y="'+(y-(index===1 ? 27 : 11))+'" fill="'+color+'" text-anchor="middle" font-size="18">'+labels[index]+'</text>').join('');
}
function draw() {
  const m = -1 + speed * time;
  const n = 9 + time;
  $('clock').textContent = fmt(time)+' 秒';
  $('time').setAttribute('aria-valuetext', fmt(time)+' 秒');
  $('track').setAttribute('aria-label','M 在 '+fmt(m)+'，N 在 '+fmt(n)+(ruler?'，相距 '+fmt(gap()):''));
  const ticks = Array.from({length:24},(_,i)=>i*2-4).map(p=>'<path d="M '+x(p)+' 173 v 8" stroke="#8aa7bc"/><text class="axis-tick '+(p%4===0?'':'minor-tick')+'" x="'+x(p)+'" y="205" fill="#b4c9d8" font-size="15" text-anchor="middle">'+p+'</text>').join('');
  const labelX=(x(m)+x(n))/2;
  const measures = ruler ? '<path d="M '+x(m)+' 54 V 148 H '+x(n)+' V 113" stroke="#c4ed9e" stroke-width="2" fill="none" stroke-dasharray="4 4"/><g class="ruler" tabindex="0" role="button" aria-label="标记这个距离：'+fmt(gap())+'"><rect class="ruler-box" x="'+(labelX-48)+'" y="127" width="96" height="25" rx="8"/><text x="'+labelX+'" y="145" fill="#d6f3be" text-anchor="middle" font-size="17">距离 '+fmt(gap())+'</text></g>'  : '';
  $('track').innerHTML = '<path d="M 22 177 H 731 l -8 -5 m 8 5 l -8 5" stroke="#9cb5c9" fill="none"/>'+ticks+measures+
    segment(-2 + speed * time,2,54,'#ffe2a0',['A','M','B'])+
    segment(6 + time,6,113,'#a6eaff',['C','N','D']);
}
function move(value) {
  time = value;
  $('time').value = value;
  draw();
}
$('time').oninput = () => move(Number($('time').value));
function reset() {
  stamps = new Set();
  formula=[];
  $('formula').hidden=true;
  $('formula').innerHTML='';
  $('time').max = speed === 2 ? 16 : 9;
  $('intro').textContent = 'AB 长 2，CD 长 6。起点 A 在 −2，B 和 C 相隔 6。AB 每秒向右走 '+speed+' 个单位，CD 每秒向右走 1 个单位。找出 M、N 相距 4 的所有时刻。';
  $('marks').textContent = '已标记时刻 · 暂无';
  $('feedback').textContent = speed === 2 ? '先拖时间轴，看哪个中点追得更快。过了相遇的时刻，谁在前面？' : '先用你自己的方法推算，再拖到那个时刻检查。';
  $('variation').hidden = speed === 2;
  $('switch').hidden = speed === 2;
  $('switch').textContent = speed === 2 ? '试一道变化题' : '回到原题';
  move(0);
}
function mark() {
  if (gap() !== 4) {
    $('feedback').textContent = '此刻相距 '+fmt(gap())+'。看看谁在前，再决定时间往哪边拖。';
    return;
  }
  stamps.add(time);
  $('marks').textContent = '已标记时刻 · '+[...stamps].sort((a,b)=>a-b).map(t=>fmt(t)+' 秒').join('、');
  $('feedback').textContent = stamps.size === 2
    ? '两个时刻都找到了。能指着数轴说说，为什么一次是 N 在前，另一次是 M 在前吗？'
    : '这里相距 4。把时间移到另一点在前的时候，还能找出同样的间距吗？';
  if (stamps.size === 2 && $('formula').hidden) {
    $('formula').hidden=false;
    renderFormula();
    if (speed===2 && voice.paused) speak('lineBuild');
  }
}
$('track').addEventListener('click',event=>{if(event.target.closest('.ruler')) mark();});
$('track').addEventListener('keydown',event=>{
  if (event.target.closest('.ruler') && ['Enter',' '].includes(event.key)) {event.preventDefault();mark();}
});
$('switch').onclick = () => {speed = speed===2?3:2;reset();$('time').focus();};

const voice = new Audio();
let heard = false;
function speak(key) {
  voice.pause();
  voice.src='data:audio/mpeg;base64,'+lineClips[key];
  void voice.play().catch(()=>{});
}
function startVoice() {if (!heard) {heard=true;speak('lineIntro');}}
$('audio').onclick = () => {heard=true;speak('lineIntro');};
$('time').addEventListener('pointerdown',startVoice,{once:true});
$('time').addEventListener('keydown',startVoice,{once:true});
let formula = [];
const tile = (symbol,index) => '<button type="button" class="line-tile" data-symbol="'+symbol+'"'+(index===undefined?'':' data-index="'+index+'"')+'>'+symbol+'</button>';
function renderFormula() {
  const built=formula.join('');
  const motion=speed===2?'t':'2×t';
  const valid=['|10−'+motion+'|＝4','|'+motion+'−10|＝4'].includes(built);
  const meanings={'10':'这块 10 来自 0 秒时两点的距离。','t':speed===2?'t 是经过的时间。每秒追回一格时，t 秒追回 t 格。':'t 是经过的时间。每秒追回两格，t 秒追回 2×t 格。','2':'变化题里，两点每秒的差是两格。','−':'用开始的间隔减去追回的格数；追上以后，这个差会变成负数。','|':'两根竖线要把整个差夹起来，表示只看距离。','4':'4 是题目要找的距离，放在等号的另一边。'};
  const note=valid?'这条方程说的是：两点位置相减再取绝对值，得到的距离等于题目要求的 4。指着图解释每一块。'
    : !built?'先找一块表示开始的间隔。再想 t 秒后，领先的距离改变了多少。'
    : built.includes('＝')?'等号右边来自题目。回头看看左边，换成另一点在前，写出的距离还是正的吗？'
    : (meanings[formula.at(-1)] || '比较开始的间隔与后来追回的格数。');
  $('formula').innerHTML='<p><strong>把图搭成方程</strong> · <span class="muted">拖积木到虚线里。拖回上面可以取走。</span></p><p>起点：看图上的 0 秒。变化：比较两个中点每秒各走了几格。目标：找相距 4 的时刻。</p><div class="line-bank">'+['10','2','t','−','×','|','|','＝','4'].map(symbol=>tile(symbol)).join('')+'</div><div class="line-expression">'+(formula.map(tile).join('')||'把积木拖到这里')+'</div><p role="status">'+note+'</p>';
  if (valid) $('switch').hidden=false;
}
function placeTile(button, to) {
  if (!to) return;
  if (button.dataset.index!==undefined) formula.splice(Number(button.dataset.index),1);
  if (to.classList.contains('line-expression') && formula.length<10) formula.push(button.dataset.symbol);
  renderFormula();
}
let grab, lastDrop=0;
$('formula').addEventListener('pointerdown',event=>{
  const button=event.target.closest('.line-tile');
  if (button && event.isPrimary && event.button===0) grab={button,id:event.pointerId,x:event.clientX,y:event.clientY};
});
window.addEventListener('pointermove',event=>{
  if (grab?.id!==event.pointerId) return;
  if (!grab.ghost && Math.hypot(event.clientX-grab.x,event.clientY-grab.y)>6) {
    grab.ghost=grab.button.cloneNode(true);
    grab.ghost.classList.add('ghost');
    document.body.append(grab.ghost);
  }
  if (!grab.ghost) return;
  grab.ghost.style.left=event.clientX+'px';grab.ghost.style.top=event.clientY+'px';
  grab.over?.classList.remove('over');
  grab.over=document.elementFromPoint(event.clientX,event.clientY)?.closest('.line-bank,.line-expression');
  grab.over?.classList.add('over');
});
function dropTile(event) {
  if (grab?.id!==event.pointerId) return;
  const current=grab;grab=null;
  if (!current.ghost) return;
  current.ghost.remove();current.over?.classList.remove('over');lastDrop=performance.now();
  if (event.type==='pointerup') placeTile(current.button,current.over);
}
window.addEventListener('pointerup',dropTile);
window.addEventListener('pointercancel',dropTile);
$('formula').addEventListener('click',event=>{
  const button=event.target.closest('.line-tile');
  if (!button || (event.detail && performance.now()-lastDrop<300)) return;
  placeTile(button,$('formula').querySelector(button.dataset.index===undefined?'.line-expression':'.line-bank'));
});
reset();
</script>
