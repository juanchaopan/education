events {}
http {
  access_log off;
  server_tokens off;
  ssl_certificate /etc/education-tls/cert.pem;
  ssl_certificate_key /etc/education-tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  proxy_connect_timeout 2s;
  proxy_read_timeout 12s;
  # Explicit loopback-only listeners let tests choose instances without a diagnostic API.
  server {
    listen 443 ssl;
    server_name localhost;
    location / {
      proxy_pass http://app-a:3001;
      proxy_set_header Host $http_host;
    }
  }
  server {
    listen 444 ssl;
    server_name localhost;
    location / {
      proxy_pass http://app-b:3001;
      proxy_set_header Host $http_host;
    }
  }
}
