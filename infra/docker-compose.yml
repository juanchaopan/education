name: education-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: education
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: education
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U education -d education']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      secrets:
        - proxy_ca
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      PAID_AI_ENABLED: ${PAID_AI_ENABLED:-true}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  database:
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-/etc/ssl/certs/ca-certificates.crt}
