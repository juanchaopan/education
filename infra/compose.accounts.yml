# Isolated destructive account tests only; never point this stack at an existing database.
x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-education-accounts}-app
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3001
    DATABASE_URL: postgres://education:${POSTGRES_PASSWORD:?Required}@db:5432/education_accounts_test
    APP_ORIGIN: https://localhost:${ACCOUNTS_PORT_A:-8443}
    REGISTRATION_ENABLED: 'true'
    AUTH_RATE_LIMIT_KEY: ${AUTH_RATE_LIMIT_KEY:?Required}
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 2s
    timeout: 4s
    retries: 20
  stop_grace_period: 15s
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: education
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: education_accounts_test
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U education -d education_accounts_test']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    build:
      context: ..
      dockerfile: infra/Dockerfile
      secrets: [proxy_ca]
    command: ['node', 'apps/api/dist/database/migrate.js']
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  app-a:
    <<: *app
  app-b:
    <<: *app
    command: ['node', 'infra/serve-function.mjs']
  gateway:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:${ACCOUNTS_PORT_A:-8443}:443'
      - '127.0.0.1:${ACCOUNTS_PORT_B:-8444}:444'
    volumes:
      - ./accounts-nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ACCOUNTS_TLS_DIR:?Required}:/etc/education-tls:ro
    depends_on:
      app-a:
        condition: service_started
      app-b:
        condition: service_started
volumes:
  database:
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-/etc/ssl/certs/ca-certificates.crt}
